name: CAN SLIM Scanner

on:
  schedule:
    # Run at 10:00 PM UTC Mon-Fri (after US market close + backfill). GitHub usually starts it around 02:00 UTC, when
    # Yahoo often has not yet published the session's stock / ETF daily bars: the scan can come out one session behind.
    - cron: '0 22 * * 1-5'
    # 6 Nov 2026 (Fabio): morning run at 09:30 Berlin, Tue-Sat (= the Mon-Fri sessions), when the bars are published.
    # Cron is UTC: 08:30 UTC = 09:30 CET (winter). From 29 Mar 2027 (CEST) this is 10:30 Berlin; change to '30 7' then.
    # GitHub can start scheduled runs late.
    - cron: '30 8 * * 2-6'
  workflow_dispatch:
    inputs:
      universe:
        description: 'Universe: sp500, sp500_nasdaq100, russell1000, russell3000'
        required: false
        default: 'russell1000'

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure git credentials
        run: git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          UNIVERSE: ${{ inputs.universe || 'russell1000' }}
        run: python StockScanner/run_scanner.py

      - name: Commit results
        run: |
          git config user.name  "MRS Bot"
          git config user.email "mrs-bot@epistruct.com"
          # 13 Nov 2026: -A also adds / removes scan_coverage_low.txt (the scanner keeps the previous scan when a run
          # covers far fewer stocks, and writes that flag for the dashboard)
          git add -A StockScanner/output/scan_results.csv
          [ -e StockScanner/output/scan_coverage_low.txt ] && git add StockScanner/output/scan_coverage_low.txt
          git ls-files --error-unmatch StockScanner/output/scan_coverage_low.txt >/dev/null 2>&1 && git add -A StockScanner/output/scan_coverage_low.txt
          git diff --staged --quiet || git commit -m "scanner: $(date +%Y-%m-%d)"
          git pull --rebase --autostash || true
          git push

      # ── Industry drill-down for the sector table (industry ETFs + top 10 holdings) ──
      # Runs even if the CAN SLIM scan fails, and commits only its own two files.
      - name: Run industry RS
        if: always()
        continue-on-error: true
        run: python StockScanner/run_industry.py

      - name: Commit industry results
        if: always()
        run: |
          git config user.name  "MRS Bot"
          git config user.email "mrs-bot@epistruct.com"
          if [ -f StockScanner/output/industry_rs.csv ]; then
            git add StockScanner/output/industry_rs.csv StockScanner/output/industry_holdings.csv
            git diff --staged --quiet || git commit -m "industry: $(date +%Y-%m-%d)"
            git pull --rebase --autostash || true
            git push
          fi
